services:
  warehouse:
    build: .
    image: cell-traffic-warehouse:1.0.0
    container_name: cell-traffic-warehouse
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      WORKER_POLL_INTERVAL: "0.15"
      MAX_UPLOAD_BYTES: "104857600"
    volumes:
      - warehouse-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  warehouse-data:
